name: Build PyClean Desktop (Windows)

on:
  push:
    branches:
      - v1.1-rename-move
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout PyClean Desktop
        uses: actions/checkout@v4

      - name: Install Qt (no Qt account required)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qthttpserver
          cache: 'false'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build-release --config Release --parallel 2

      - name: Bundle EXE and Qt dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "build-release/Release/PyClean_CPP.exe" "package/PyClean_CPP.exe"
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --compiler-runtime --dir "$env:GITHUB_WORKSPACE/package" "$env:GITHUB_WORKSPACE/package/PyClean_CPP.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem package -Recurse | Select-Object FullName

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: PyClean-Desktop-Windows-Portable
          path: package/
          if-no-files-found: error
          retention-days: 7
